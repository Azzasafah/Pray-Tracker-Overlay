name: Build & Release ASDO Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable (.exe)
        run: |
          python build_exe.py

      - name: Set up Inno Setup
        uses: Brahn/actions-inno-setup@v1.2.0

      - name: Build Windows Setup Installer (.exe)
        run: |
          iscc installer.iss

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/AuraSalatOverlay-Setup-*.exe
            dist/AuraSalatOverlay.exe
          draft: false
          prerelease: false
          generate_release_notes: true
